{{- /* 内联 SVG 图标集：全部为 24x24 描边风格，颜色继承 currentColor。
       传 inner=true 时只输出里面的路径（用于 <defs> 里给球面片区当符号）。 */ -}}
{{- $name := .name | default "link" -}}
{{- $class := .class | default "icon" -}}
{{- if not .inner -}}
<svg class="{{ $class }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{{- end -}}
  {{- if eq $name "user" -}}
    <circle cx="12" cy="8" r="3.6"/><path d="M4.6 20.4c1.2-3.9 4-5.7 7.4-5.7s6.2 1.8 7.4 5.7"/>
  {{- else if eq $name "feather" -}}

    <path d="M5 19 19 5"/><path d="M14.5 9.5H9.4"/>

    <path d="M17.5 4.5H6.5l6 7.5-6 7.5h11"/>

    <rect x="4.5" y="10.4" width="15" height="10.2" rx="2"/>
    <path d="M8.4 10.4V7.9a3.6 3.6 0 0 1 7.2 0v2.5"/><circle cx="12" cy="15.5" r="1.2"/>

    <circle cx="7.8" cy="15.4" r="3.6"/><path d="M10.4 12.8 20 3.2M15.8 7.4l3 3M13.2 10l3 3"/>

    <path d="M9.6 14.4 14.4 9.6"/>

  {{- else if eq $name "menu" -}}
    <path d="M3.4 7h17.2M3.4 12h17.2M3.4 17h17.2"/>
  {{- else if eq $name "close" -}}
    <path d="M6.2 6.2 17.8 17.8M17.8 6.2 6.2 17.8"/>

    <path d="M4.4 12h15.2"/><path d="m13.4 5.8 6.2 6.2-6.2 6.2"/>
  {{- else if eq $name "arrow-down" -}}
    <path d="M12 4.4v15.2"/><path d="m5.8 13.4 6.2 6.2 6.2-6.2"/>

    <rect x="3.5" y="5.2" width="17" height="15.3" rx="2"/><path d="M3.5 10h17M8 3.4v3.2M16 3.4v3.2"/>
  {{- else if eq $name "clock" -}}
    <circle cx="12" cy="12" r="8.6"/><path d="M12 7.2V12l3.2 2.1"/>

  {{- else if eq $name "check" -}}
    <path d="m4.6 12.6 4.8 4.8 10-11"/>
  {{- else -}}
    <path d="M9.6 14.4 14.4 9.6"/><path d="M11.2 6.6 13 4.8a4.4 4.4 0 0 1 6.2 6.2L17.4 12.8"/>
  {{- end -}}
{{- if not .inner -}}
</svg>
{{- end -}}
