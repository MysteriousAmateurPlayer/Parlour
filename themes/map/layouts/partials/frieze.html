{{- /* 花带：稀疏的定点星与圆珠（"河"由 canvas 实时绘制，便于整体移相） */ -}}
{{- $dir := .dir | default "h" -}}
{{- if eq $dir "h" -}}
<svg class="frieze frieze--h" width="100%" height="44" aria-hidden="true" focusable="false" preserveAspectRatio="none">
  <defs>
    <pattern id="fr-h" patternUnits="userSpaceOnUse" width="240" height="44">
      <g fill="none" stroke="currentColor" stroke-width="0.9" stroke-linecap="round">
        <path d="M56.60 11.00L60.00 11.00L63.40 11.00M60.00 7.60L60.00 11.00L60.00 14.40M176.60 33.00L180.00 33.00L183.40 33.00M180.00 29.60L180.00 33.00L180.00 36.40M117.80 22.00L120.00 22.00L122.20 22.00M120.00 19.80L120.00 22.00L120.00 24.20"/>
      </g>
      <g fill="currentColor" stroke="none"><circle cx="30.00" cy="17.00" r="0.95"/><circle cx="90.00" cy="17.00" r="0.95"/><circle cx="150.00" cy="27.00" r="0.95"/><circle cx="210.00" cy="27.00" r="0.95"/><circle cx="0.00" cy="22.00" r="1.25"/><circle cx="120.00" cy="22.00" r="1.25"/></g>
    </pattern>
  </defs>
  <rect width="100%" height="44" fill="url(#fr-h)"/>
</svg>
{{- else -}}
<svg class="frieze frieze--v" width="44" height="100%" aria-hidden="true" focusable="false" preserveAspectRatio="none">
  <defs>
    <pattern id="fr-v" patternUnits="userSpaceOnUse" width="44" height="240">
      <g transform="translate(44 0) rotate(90)">
      <g fill="none" stroke="currentColor" stroke-width="0.9" stroke-linecap="round">
        <path d="M56.60 11.00L60.00 11.00L63.40 11.00M60.00 7.60L60.00 11.00L60.00 14.40M176.60 33.00L180.00 33.00L183.40 33.00M180.00 29.60L180.00 33.00L180.00 36.40M117.80 22.00L120.00 22.00L122.20 22.00M120.00 19.80L120.00 22.00L120.00 24.20"/>
      </g>
      <g fill="currentColor" stroke="none"><circle cx="30.00" cy="17.00" r="0.95"/><circle cx="90.00" cy="17.00" r="0.95"/><circle cx="150.00" cy="27.00" r="0.95"/><circle cx="210.00" cy="27.00" r="0.95"/><circle cx="0.00" cy="22.00" r="1.25"/><circle cx="120.00" cy="22.00" r="1.25"/></g>
      </g>
    </pattern>
  </defs>
  <rect width="44" height="100%" fill="url(#fr-v)"/>
</svg>
{{- end -}}
