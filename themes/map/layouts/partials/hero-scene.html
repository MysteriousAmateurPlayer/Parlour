{{- /* 首页主视觉下缘的天际线：上半星空，下半是巨大地球的上缘弧线。
       （三个入口图标已移到下面的「地球仪」区块，这里只留景。）
       颜色全部走 CSS 变量（main.css 的 --scene-*），明暗主题自动切换。 */ -}}
<div class="hero__scene">
  <svg class="scene" viewBox="0 0 1600 460" preserveAspectRatio="xMidYMax slice"
       role="img" aria-labelledby="scene-title">
    <title id="scene-title">星空与地球天际线</title>

    <defs>
      <linearGradient id="scene-sky-grad" x1="0" y1="0" x2="0" y2="1">
        <stop class="scene__sky-0" offset="0"/>
        <stop class="scene__sky-1" offset="0.66"/>
        <stop class="scene__sky-2" offset="1"/>
      </linearGradient>
      <linearGradient id="scene-earth-grad" x1="0" y1="0" x2="0" y2="1">
        <stop class="scene__earth-0" offset="0"/>
        <stop class="scene__earth-1" offset="1"/>
      </linearGradient>
      <filter id="scene-soften" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8"/>
      </filter>
    </defs>

    {{/* ---------- 天空 ---------- */}}
    <rect class="scene__sky" x="0" y="0" width="1600" height="460" fill="url(#scene-sky-grad)"/>

    {{/* ---------- 星野 ---------- */}}
    <g class="scene__stars">
      <circle cx="140" cy="92" r="1.6" style="opacity:.40"/>
      <circle cx="262" cy="196" r="1.2" style="opacity:.46"/>
      <circle cx="392" cy="72" r="1.9" style="opacity:.5"/>
      <circle cx="474" cy="146" r="1" style="opacity:.3"/>
      <circle cx="628" cy="82" r="1.3" style="opacity:.34"/>
      <circle cx="704" cy="176" r="1" style="opacity:.28"/>
      <circle cx="902" cy="86" r="1.4" style="opacity:.42"/>
      <circle cx="968" cy="152" r="1" style="opacity:.3"/>
      <circle cx="1122" cy="112" r="1.8" style="opacity:.48"/>
      <circle cx="1246" cy="198" r="1.2" style="opacity:.38"/>
      <circle cx="1362" cy="78" r="1" style="opacity:.28"/>
      <circle cx="1476" cy="164" r="1.5" style="opacity:.34"/>
      <circle cx="196" cy="306" r="1" style="opacity:.24"/>
      <circle cx="1418" cy="318" r="1" style="opacity:.22"/>
      <circle cx="60" cy="188" r="1.1" style="opacity:.26"/>
      <circle cx="1544" cy="256" r="1.1" style="opacity:.24"/>
      <circle cx="300" cy="46" r="1.2" style="opacity:.3"/>
      <circle cx="760" cy="34" r="1.5" style="opacity:.34"/>
      <circle cx="1060" cy="42" r="1.1" style="opacity:.28"/>
      <circle cx="1330" cy="230" r="1" style="opacity:.26"/>
      <circle cx="240" cy="122" r="1.3" style="opacity:.36"/>
      <circle cx="1290" cy="96" r="1.2" style="opacity:.3"/>
    </g>

    {{/* ---------- 地球：半径 900 的超大圆，只露出上缘 ---------- */}}
    <g class="scene__earth-wrap">
      <circle class="scene__atmos" cx="800" cy="1180" r="903" filter="url(#scene-soften)"/>
      <circle class="scene__earth" cx="800" cy="1180" r="900" fill="url(#scene-earth-grad)"/>
      <circle class="scene__band" cx="800" cy="1180" r="872"/>
      <circle class="scene__band scene__band--faint" cx="800" cy="1180" r="836"/>
      <circle class="scene__horizon" cx="800" cy="1180" r="900"/>
    </g>
  </svg>
</div>
