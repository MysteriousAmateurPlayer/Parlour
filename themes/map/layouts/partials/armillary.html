{{- /* 关于本站页的宏装饰：浑天仪（Armillary sphere）。
      用 CSS 3D 真实搭建立体环：每条环都是一个"带刻度的环带"，
      各自以不同相位摆放，并用 rotate 关键帧持续 3D 旋转。
      配色遵循站点两色：环带面 = 页面背景色(--bg)，边线 = 文字深色(--ink)。
      整体靠右放置并放大，因此在页头里只露出约 2/3（与旋臂同一处理）。 */ -}}
<div class="arm3d" aria-hidden="true">
  <div class="arm3d__stage">
    <div class="arm3d__globe">
      {{- range $i := seq 0 7 }}
      <div class="arm3d__ring arm3d__ring--{{ $i }}">
        <span class="arm3d__ticks"></span>
      </div>
      {{- end }}
      <div class="arm3d__ring arm3d__ring--horizon"></div>
      <div class="arm3d__equator"></div>
      <div class="arm3d__core"></div>
      <div class="arm3d__axe"></div>
    </div>
    <div class="arm3d__stand">
      <span class="arm3d__stem"></span>
      <span class="arm3d__base"></span>
    </div>
  </div>
</div>
