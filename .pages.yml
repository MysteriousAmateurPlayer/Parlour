# ============================================================
#  Pages CMS 配置 · 网页版写作后台
#  ------------------------------------------------------------
#  怎么用：用 GitHub 账号登录 https://app.pagescms.org ，授权本仓库，
#          浏览器里就会出现下面这些栏目，可以直接写文章、传图片。
#          保存 = 自动提交到 GitHub = 网站自动重新发布（约 1~2 分钟）。
#
#  ⚠️ 维护须知：后台保存时，只会写回下面列出的字段。
#     如果删掉某个字段定义，之后从后台保存那篇文章就会把那个键一并删掉。
#     想加新字段可以，但别删。（改这个文件之前先备份，或先问我。）
#
#  字段含义速查：string 单行文本 / text 多行文本 / rich-text 正文
#               date 日期 / number 数字 / boolean 勾选框
#               image 图片 / select 下拉框 / object 子分组
#               list: true 表示这个字段可以有多条
# ============================================================

# 图片上传到仓库的 static/images/，网站上对应 /images/
media:
  input: static/images
  output: /images
  rename: safe
  categories: [image]

content:
  # ==========================================================
  #  五个版块的文章
  # ==========================================================
  - name: fanworks
    label: 二次同人创作
    type: collection
    path: content/fanworks
    exclude: [_index.md]
    format: yaml-frontmatter
    filename:
      template: "{year}-{month}-{day}-{slug}.md"
      field: create
    view: { primary: title, sort: date, order: desc }
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: date
        label: 日期
        type: date
        required: true
      - name: description
        label: 摘要（显示在卡片和搜索结果里，一两句话）
        type: text
      - name: source
        label: 原作
        type: string
      - name: tags
        label: 标签
        type: string
        list: true
      - name: series
        label: 系列
        type: string
        list: true
      - name: cover
        label: 封面图（可留空）
        type: image
      - name: draft
        label: 草稿（勾着就不对外显示）
        type: boolean
        default: true
      - name: body
        label: 正文（Markdown）
        type: rich-text
        options:
          switcher: true

  - name: math
    label: 数学分享
    type: collection
    path: content/math
    exclude: [_index.md]
    format: yaml-frontmatter
    filename:
      template: "{year}-{month}-{day}-{slug}.md"
      field: create
    view: { primary: title, sort: date, order: desc }
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: date
        label: 日期
        type: date
        required: true
      - name: description
        label: 摘要
        type: text
      - name: tags
        label: 标签
        type: string
        list: true
      - name: math
        label: 启用公式渲染（KaTeX，写 $公式$ 或 $$公式$$ 时必须勾上）
        type: boolean
        default: true
      - name: toc
        label: 显示右侧目录
        type: boolean
        default: true
      - name: draft
        label: 草稿
        type: boolean
        default: true
      - name: body
        label: 正文（Markdown，公式直接写 LaTeX）
        type: rich-text
        options:
          switcher: true

  - name: garden
    label: 园艺记录
    type: collection
    path: content/garden
    exclude: [_index.md]
    format: yaml-frontmatter
    filename:
      template: "{year}-{month}-{day}-{slug}.md"
      field: create
    view: { primary: title, sort: date, order: desc }
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: date
        label: 日期
        type: date
        required: true
      - name: description
        label: 摘要
        type: text
      - name: weather
        label: 天气（显示在年表里，例如：晴，22℃）
        type: string
      - name: tags
        label: 标签
        type: string
        list: true
      - name: draft
        label: 草稿
        type: boolean
        default: true
      - name: body
        label: 正文（Markdown）
        type: rich-text
        options:
          switcher: true

  - name: kitchen
    label: 烹饪食谱
    type: collection
    path: content/kitchen
    exclude: [_index.md]
    format: yaml-frontmatter
    filename:
      template: "{year}-{month}-{day}-{slug}.md"
      field: create
    view: { primary: title, sort: date, order: desc }
    fields:
      - name: title
        label: 菜名
        type: string
        required: true
      - name: date
        label: 日期
        type: date
        required: true
      - name: description
        label: 一句话介绍
        type: text
      - name: servings
        label: 份量（人份）
        type: number
      - name: prep_time
        label: 准备时间（分钟）
        type: number
      - name: cook_time
        label: 烹饪时间（分钟）
        type: number
      - name: difficulty
        label: 难度
        type: select
        options:
          values: [简单, 中等, 麻烦]
      - name: tags
        label: 标签
        type: string
        list: true
      - name: ingredients
        label: 食材（按「主料 / 调味 / 可选」分组）
        type: object
        list:
          collapsible:
            collapsed: false
            summary: "{group}"
        fields:
          - name: group
            label: 分组名
            type: string
          - name: items
            label: 这一组的食材（每行一条）
            type: string
            list: true
      - name: steps
        label: 步骤（每行一步，会显示成带编号的卡片）
        type: string
        list: true
      - name: draft
        label: 草稿
        type: boolean
        default: true
      - name: body
        label: 心得 / 关键点（Markdown，会显示在步骤下面）
        type: rich-text
        options:
          switcher: true

  - name: vault
    label: 里版内容
    type: collection
    path: content/vault
    exclude: [_index.md]
    format: yaml-frontmatter
    filename:
      template: "{year}-{month}-{day}-{slug}.md"
      field: create
    view: { primary: title, sort: date, order: desc }
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: date
        label: 日期
        type: date
        required: true
      - name: description
        label: 摘要
        type: text
      - name: tags
        label: 标签
        type: string
        list: true
      - name: toc
        label: 显示右侧目录
        type: boolean
        default: false
      - name: private
        label: 不加入站点地图、不被搜索引擎收录（务必保持勾选）
        type: boolean
        default: true
      - name: body
        label: 正文（Markdown）
        type: rich-text
        options:
          switcher: true

  # ==========================================================
  #  站点设置（不是文章，改完直接生效）
  # ==========================================================
  - name: settings
    label: 站点设置
    type: group
    items:
      - name: home
        label: 首页文案
        type: file
        path: data/home.yaml
        format: yaml
        fields:
          - name: hero
            label: 主视觉（首屏）
            type: object
            fields:
              - name: kicker
                label: 名字上方的小字
                type: string
              - name: name
                label: 名字（超大字）
                type: string
              - name: tagline
                label: 一行定位语
                type: string
              - name: intro
                label: 自我介绍正文
                type: text
              - name: primary
                label: 主按钮（实心）
                type: object
                fields:
                  - name: label
                    label: 按钮文字
                    type: string
                  - name: url
                    label: 链接
                    type: string
              - name: secondary
                label: 次按钮（描边）
                type: object
                fields:
                  - name: label
                    label: 按钮文字
                    type: string
                  - name: url
                    label: 链接
                    type: string
          - name: about
            label: 首页「关于我」区块
            type: object
            fields:
              - name: title
                label: 标题
                type: string
              - name: subtitle
                label: 英文小标题
                type: string
              - name: portrait
                label: 竖版照片（上传后自动用到首页和自我介绍页）
                type: image
              - name: portraitFallback
                label: 没有照片时显示的字母
                type: string
              - name: paragraphs
                label: 段落（每行一段）
                type: string
                list: true
              - name: facts
                label: 速览（常驻 / 在做 / 写给我 之类）
                type: object
                list:
                  collapsible:
                    collapsed: false
                    summary: "{label}"
                fields:
                  - name: label
                    label: 名目
                    type: string
                  - name: value
                    label: 内容
                    type: string
          - name: latest
            label: 首页「最近的记录」
            type: object
            fields:
              - name: title
                label: 标题
                type: string
              - name: subtitle
                label: 英文小标题
                type: string
              - name: count
                label: 显示几条
                type: number

      - name: socials
        label: 联系方式
        type: file
        path: data/socials.yaml
        format: yaml
        list: true
        fields:
          - name: name
            label: 名称
            type: string
          - name: icon
            label: 图标
            type: select
            options:
              values: [mail, github, twitter, bilibili, pixiv, rss, link]
          - name: url
            label: 链接
            type: string
          - name: text
            label: 显示的文字
            type: string

      - name: aboutpage
        label: 自我介绍页正文
        type: file
        path: content/about/_index.md
        format: yaml-frontmatter
        fields:
          - name: title
            label: 标题
            type: string
          - name: description
            label: 副标题 / 摘要
            type: text
          - name: layout
            label: 版面模板（请勿修改）
            type: string
            readonly: true
          - name: body
            label: 正文（Markdown）
            type: rich-text
            options:
              switcher: true
