# ============================================================
#  首页文案（改这里就能改首页，不用动模板）
# ============================================================

hero:
  # 太阳上的小字前缀（字号很小）
  kicker: "欢迎来到MAP的"
  # 太阳上的大标题（真正的站名，字号最大）
  name: "幻想星图会客厅"
  # 首页的浏览器标签页标题
  tabTitle: "欢迎来到幻想星图会客厅！"
  # 两个按钮：primary 为实心，secondary 为描边
  primary:
    label: "关于本站"
    url: "#about-preview"
    icon: "axes"
  secondary:
    label: "最近更新"
    url: "#latest"
    icon: "clock"

# 首页「关于我」预览区块
about:
  title: "关于我"
  subtitle: "About"
  # 放一张竖版照片到 static/images/portrait.jpg，然后取消下一行注释
  # portrait: "/images/portrait.jpg"
  portraitFallback: "MAP"
  paragraphs:
    - "白天和人打交道，夜里和公式打交道。写代码、做题、种花、做饭，是我用来确认自己还活着的四件事。"
    - "这个网站没有什么宏伟目标，只是想把散落各处的东西收拾到一处——这样若干年后回看，至少知道这些年时间去了哪里。"
  facts:
    - label: "常驻"
      value: "某座四季分明的城市"
    - label: "在做"
      value: "数学、写作、园艺"
    - label: "写信给我"
      value: "map@example.com"

# 首页「最近的记录」区块
latest:
  title: "最近的记录"
  subtitle: "Recent"
  count: 6
