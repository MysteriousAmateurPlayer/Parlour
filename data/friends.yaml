# ============================================================
#  页脚 · 友情链接
#  ------------------------------------------------------------
#  每一项：
#    name   —— 主链接的文字（必填）
#    url    —— 主链接地址（必填，站外建议写完整网址）
#    banner —— 头图，可选。图片放到 static/images/ 下，这里写 /images/xxx.jpg
#              留空就只显示文字卡片
#    note   —— 一句话介绍（小字），可选
#  想加几条就往下接几条，格式一样。
# ============================================================

- name: "示例友链 A"
  url: "https://example.com"
  banner: ""
  note: "这里写一句话介绍"

- name: "示例友链 B"
  url: "https://example.com"
  banner: ""
  note: "带 banner 的话，把图片放进 static/images/，再写 /images/文件名.jpg"

- name: "示例友链 C"
  url: "https://example.com"
  banner: ""
  note: ""
